<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte du monde</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #map { position: absolute; inset: 0; background: #000; }
  #coords { position: absolute; z-index: 1000; left: 10px; bottom: 10px;
            padding: 4px 8px; font: 13px monospace; color: #fff;
            background: rgba(0,0,0,.65); border-radius: 4px; pointer-events: none; }
</style>
</head>
<body>
<div id="map"></div>
<div id="coords"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const META = {"width": 12288, "height": 6144, "tile": 256, "maxZoom": 6, "ext": "webp", "scale": 0.33, "x0": 0, "y0": 0, "cellW": 32, "cellH": 16};
const map = L.map('map', { crs: L.CRS.Simple, minZoom: 0, maxZoom: META.maxZoom + 2,
                            zoomSnap: 0.5, attributionControl: false });
const bounds = L.latLngBounds(map.unproject([0, META.height], META.maxZoom),
                              map.unproject([META.width, 0], META.maxZoom));
L.tileLayer('{z}/{x}/{y}.' + META.ext, {
  tileSize: META.tile, minZoom: 0, maxNativeZoom: META.maxZoom, maxZoom: META.maxZoom + 2,
  noWrap: true, bounds: bounds, keepBuffer: 2
}).addTo(map);
map.setMaxBounds(bounds.pad(0.1));
map.fitBounds(bounds);

// Coordonnees en jeu (X, Y) sous la souris, si l'echelle du rendu est connue.
const out = document.getElementById('coords');
if (META.scale) {
  map.on('mousemove', e => {
    const p = map.project(e.latlng, META.maxZoom);
    const x = Math.floor(p.x / (META.cellW * META.scale) + META.x0);
    const y = Math.floor(p.y / (META.cellH * META.scale) + META.y0);
    out.textContent = (p.x < 0 || p.y < 0 || p.x > META.width || p.y > META.height)
      ? '' : 'X ' + x + '  Y ' + y;
  });
} else {
  out.remove();
}
</script>
</body>
</html>
